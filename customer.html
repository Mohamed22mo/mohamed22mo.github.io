<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F2740">
<title>حسابي ومتجري</title>
<link rel="manifest" href="customer.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{--navy:#0F2740;--navy2:#1F4E78;--gold:#C9A55C;--bg:#f2f5f9;--card:#fff;--line:#dde3ea;--red:#b3202e;--green:#16703c;--ink:#14202e;--mut:#667587}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));min-height:100vh}
header{background:linear-gradient(180deg,#0A1D33,#143A5F);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:18px;margin:0}
header small{color:#c9d6e4;display:block;font-size:12px;margin-top:2px}
header .ic{width:42px;height:42px;border-radius:12px;background:rgba(201,165,92,.15);display:grid;place-items:center;font-size:22px}
main{padding:14px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px rgba(15,39,64,.05)}
.card h2{font-size:16px;margin:0 0 10px;color:var(--navy2)}
.big{border-radius:20px;padding:18px;text-align:center;margin-bottom:12px}
.big .l{font-size:14px;font-weight:700;opacity:.85}
.big .v{font-size:34px;font-weight:900;margin-top:4px}
.due{background:#fff1f1;border:2px solid var(--red);color:var(--red)}
.ok{background:#eefaf2;border:2px solid #1f8a4c;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{border-radius:16px;padding:14px;text-align:center;background:#fff;border:1px solid var(--line)}
.mini .l{font-size:13px;color:var(--mut);font-weight:700}
.mini .v{font-size:22px;font-weight:900;margin-top:4px;color:var(--navy2)}
.gold{background:linear-gradient(135deg,#fff8e6,#fdf0cf);border-color:#e6cd8f}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--navy);color:#fff;padding:9px 6px;font-weight:800}
td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
td.r{text-align:right}
tr:nth-child(even) td{background:#f7f9fc}
tr.tot td{background:#fff3d1;font-weight:900;border-top:2px solid var(--navy)}
.mut{color:var(--mut);font-size:12px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-size:16px}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--navy2)}
button{border:0;border-radius:12px;padding:12px 16px;font-weight:800;background:var(--navy2);color:#fff;font-size:15px;cursor:pointer}
button.gb{background:var(--gold);color:#241a05}
button.ghost{background:#eaf0f7;color:var(--navy2)}
button.red{background:#fdecec;color:var(--red)}
button:disabled{opacity:.55}
.full{width:100%}
.login{max-width:420px;margin:30px auto;padding:0 16px}
.err{color:var(--red);font-weight:700;margin-top:10px;font-size:14px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:10px 4px 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav button .e{font-size:22px}
nav button.on{color:var(--navy2)}
nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;background:var(--gold);border-radius:0 0 4px 4px}
.cb{position:absolute;top:4px;right:calc(50% - 26px);background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.pgrid{grid-template-columns:repeat(3,1fr)}}
.pc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.pc .im{aspect-ratio:1/1;background:#eef2f7;display:grid;place-items:center;font-size:34px;color:#9aa9ba;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover}
.pc .b{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pc .n{font-weight:800;font-size:14px;line-height:1.4}
.pc .p{color:var(--green);font-weight:900}
.qty{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
.qty button{padding:6px 12px;font-size:18px;border-radius:10px;background:#eaf0f7;color:var(--navy2)}
.qty b{min-width:26px;text-align:center}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;border-radius:16px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:19;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.cartbar button{background:var(--gold);color:#241a05}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:flex;align-items:flex-end}
.sheet>div{background:#fff;border-radius:22px 22px 0 0;padding:16px;width:100%;max-height:88vh;overflow:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.st{display:inline-block;padding:2px 10px;border-radius:10px;font-size:12px;font-weight:800}
.st.new{background:#fff3d1;color:#7a5a00}.st.prep{background:#dcecff;color:#14518f}.st.done{background:#dff5e7;color:var(--green)}.st.cancel{background:#fdecec;color:var(--red)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#14202e;color:#fff;padding:10px 18px;border-radius:12px;z-index:60;font-weight:700;display:none;max-width:90%}
.hide{display:none!important}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="v-login" class="login hide">
  <div style="text-align:center;margin:10px 0 22px">
    <div style="width:84px;height:84px;margin:0 auto 10px;border-radius:22px;background:linear-gradient(135deg,#0A1D33,#1F4E78);display:grid;place-items:center;font-size:42px">🧾</div>
    <h1 style="margin:0;color:var(--navy)">حسابي ومتجري</h1>
    <div class="mut">ادخل برقم موبايلك وكلمة المرور التي وصلتك</div>
  </div>
  <div class="card">
    <label>رقم الموبايل</label>
    <input id="l-ph" inputmode="tel" autocomplete="username" placeholder="01xxxxxxxxx">
    <label>كلمة المرور</label>
    <input id="l-pw" type="password" autocomplete="current-password" placeholder="••••••">
    <button class="full gb" id="l-go" style="margin-top:14px">دخول</button>
    <div id="l-err" class="err"></div>
  </div>
</div>

<div id="v-app" class="hide">
  <header>
    <div><h1 id="h-name">مرحباً</h1><small id="h-sub"></small></div>
    <div class="ic">🧾</div>
  </header>
  <main>
    <section id="t-acc"></section>
    <section id="t-shop" class="hide"></section>
    <section id="t-ord" class="hide"></section>
    <section id="t-more" class="hide"></section>
  </main>
  <div id="cartbar" class="cartbar hide"><div><b id="cb-n">0</b> صنف — <b id="cb-t">0</b> ج</div><button id="cb-open">مراجعة الطلب</button></div>
  <nav>
    <button data-t="t-acc" class="on"><span class="e">🧾</span>حسابي</button>
    <button data-t="t-shop"><span class="e">🛍️</span>المتجر</button>
    <button data-t="t-ord"><span class="e">📦</span>طلباتي</button>
    <button data-t="t-more"><span class="e">⚙️</span>المزيد</button>
  </nav>
  <div id="sheet" class="sheet hide"><div id="sheet-in"></div></div>
</div>

<script src="fb-config.js"></script>
<script type="module">
const FB = window.HISAB_FB, B = FB.sdk;
const [appM, authM, fsM] = await Promise.all([import(B+'firebase-app.js'), import(B+'firebase-auth.js'), import(B+'firebase-firestore.js')]);
const app = appM.initializeApp(FB.config);
const auth = authM.getAuth(app);
const fs = fsM.initializeFirestore(app, { experimentalAutoDetectLongPolling:true, ignoreUndefinedProperties:true });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = n => Number(n || 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
const toast = (t) => { const e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => e.style.display = 'none', 2600); };
const errText = e => {
  const c = e && e.code || '';
  if (c === 'auth/network-request-failed' || c === 'unavailable') return 'لا يوجد اتصال بالإنترنت';
  if (c === 'auth/too-many-requests') return 'محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة';
  if (c === 'auth/invalid-api-key') return 'إعداد الموقع غير صحيح، تواصل مع الإدارة';
  if (c === 'permission-denied') return 'ليس لديك صلاحية لهذه البيانات';
  return (e && (e.message || c)) || 'حدث خطأ';
};

let ME = { ph:'', uid:'', name:'' }, DATA = null, CAT = [], CATAT = 0, ORD = [], unsubs = [];
let CART = {}; try { CART = JSON.parse(localStorage.getItem('hc_cart') || '{}'); } catch (e) {}
const saveCart = () => { try { localStorage.setItem('hc_cart', JSON.stringify(CART)); } catch (e) {} };

/* ---------- الدخول ---------- */
$('l-go').onclick = async () => {
  const ph = FB.normPhone($('l-ph').value), pw = $('l-pw').value, er = $('l-err');
  er.textContent = '';
  if (!ph) { er.textContent = 'اكتب رقم الموبايل (11 رقماً يبدأ بـ 01)'; return; }
  if (!pw) { er.textContent = 'اكتب كلمة المرور'; return; }
  const btn = $('l-go'); btn.disabled = true; btn.textContent = 'جارٍ الدخول…';
  let hint = 0; try { hint = +localStorage.getItem('hc_ver_' + ph) || 0; } catch (e) {}
  const order = [hint, 0, 1, 2, 3].filter((v, i, a) => a.indexOf(v) === i);
  let ok = false, last = null;
  for (const v of order) {
    try { await authM.signInWithEmailAndPassword(auth, FB.emailFor(ph, v), pw); try { localStorage.setItem('hc_ver_' + ph, String(v)); } catch (e) {} ok = true; break; }
    catch (e) { last = e; if (e.code === 'auth/too-many-requests' || e.code === 'auth/network-request-failed') break; }
  }
  btn.disabled = false; btn.textContent = 'دخول';
  if (!ok) er.textContent = (last && (last.code === 'auth/too-many-requests' || last.code === 'auth/network-request-failed' || last.code === 'auth/invalid-api-key')) ? errText(last) : 'رقم الموبايل أو كلمة المرور غير صحيحة';
};
$('l-pw').onkeydown = e => { if (e.key === 'Enter') $('l-go').click(); };

authM.onAuthStateChanged(auth, u => {
  unsubs.forEach(f => { try { f(); } catch (e) {} }); unsubs = []; DATA = null; ORD = [];
  if (!u) { $('v-app').classList.add('hide'); $('v-login').classList.remove('hide'); return; }
  ME.uid = u.uid; ME.ph = (u.email || '').split('@')[0].split('.')[0];
  $('v-login').classList.add('hide'); $('v-app').classList.remove('hide');
  renderAcc(); renderOrd(); renderMore(); updateCart();
  unsubs.push(fsM.onSnapshot(fsM.doc(fs, 'customers', ME.ph), s => { DATA = s.exists() ? s.data() : false; if (DATA) ME.name = DATA.name; renderAcc(); head(); }, e => { DATA = null; $('t-acc').innerHTML = '<div class="card"><b>تعذر عرض حسابك</b><p class="mut">' + esc(errText(e)) + '. إن تغيّرت كلمة مرورك فسجّل الدخول بالكلمة الجديدة.</p></div>'; }));
  const q = fsM.query(fsM.collection(fs, 'orders'), fsM.where('uid', '==', u.uid));
  unsubs.push(fsM.onSnapshot(q, s => { ORD = []; s.forEach(d => ORD.push({ id:d.id, ...d.data() })); ORD.sort((a, b) => ms(b) - ms(a)); renderOrd(); }, () => {}));
});
const ms = o => { const t = o.createdAt; return t && t.toMillis ? t.toMillis() : (t && t.seconds ? t.seconds * 1000 : Date.now()); };
function head() { $('h-name').textContent = ME.name ? 'أهلاً ' + ME.name : 'مرحباً'; $('h-sub').textContent = ME.ph; }

/* ---------- حسابي ---------- */
function renderAcc() {
  const t = $('t-acc'); head();
  if (DATA === null) { t.innerHTML = '<div class="card mut">جارٍ التحميل…</div>'; return; }
  if (DATA === false) { t.innerHTML = '<div class="card"><b>لم تُنشر بيانات حسابك بعد</b><p class="mut">تواصل مع الإدارة.</p></div>'; return; }
  const d = DATA, due = +d.due || 0;
  const rows = d.rows || [];
  const tot = rows.reduce((s, r) => s + (+r.a || 0), 0);
  t.innerHTML =
    (due > 0.004
      ? `<div class="big due"><div class="l">المطلوب سداده</div><div class="v">${money(due)} <small>ج</small></div></div>`
      : `<div class="big ok"><div class="l">حسابك</div><div class="v">لا يوجد مبلغ مطلوب ✓</div></div>`) +
    `<div class="grid2">
       <div class="mini"><div class="l">رصيدك (المدفوع)</div><div class="v">${money(d.credit)} ج</div></div>
       <div class="mini gold"><div class="l">نقاط الكاش باك</div><div class="v">${d.pts ? d.pts.avail : 0}</div><div class="mut">= ${money(d.pts ? d.pts.value : 0)} ج</div></div>
     </div>
     <div class="card" style="margin-top:12px"><h2>كشف الحساب</h2>` +
    (rows.length
      ? `<div style="overflow-x:auto"><table><tr><th>التاريخ</th><th>البيان</th><th>المبلغ</th></tr>${rows.map(r => `<tr><td>${esc(r.d)}</td><td class="r">${esc(r.t)}</td><td><b>${money(r.a)}</b></td></tr>`).join('')}
         <tr class="tot"><td colspan="2">إجمالي الحساب</td><td>${money(d.owed != null ? d.owed : tot)}</td></tr></table></div>`
      : '<p class="mut">لا توجد عمليات مفتوحة على حسابك.</p>') +
    `</div>` +
    (d.pts ? `<div class="card gold"><h2>نقاطك</h2><p style="margin:0">لديك <b>${d.pts.avail}</b> نقطة قيمتها <b>${money(d.pts.value)} ج</b>. إجمالي ما سددته في ${esc(d.pts.year)}: <b>${money(d.pts.paid)} ج</b>.</p><p class="mut" style="margin:8px 0 0">تكسب 35 نقطة عن كل 100 ج تسددها، وكل 100 نقطة تساوي 1 ج خصماً. اطلب استبدالها من الإدارة.</p></div>` : '') +
    ((d.pays && d.pays.length) ? `<div class="card"><h2>آخر السدادات</h2>${d.pays.map(p => `<div class="row"><span>${esc(p.d)}</span><b>${money(p.a)} ج</b></div>`).join('')}</div>` : '') +
    (d.upd ? `<p class="mut" style="text-align:center">آخر تحديث: ${esc(new Date(d.upd).toLocaleString('ar-EG'))}</p>` : '');
}

/* ---------- المتجر ---------- */
let QTXT = '';
const norm = s => String(s || '').toLowerCase().replace(/[\u064B-\u0652\u0640]/g, '').replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').replace(/\s+/g, '');
async function loadCat(force) {
  if (!force && CAT.length && Date.now() - CATAT < 60000) return;
  try {
    const s = await fsM.getDocs(fsM.collection(fs, 'catalog')); CAT = [];
    s.forEach(d => { const x = d.data(); if (x.active !== false) CAT.push({ id:d.id, ...x }); });
    CAT.sort((a, b) => (a.sort || 0) - (b.sort || 0)); CATAT = Date.now();
  } catch (e) { toast(errText(e)); }
}
async function renderShop(force) {
  const t = $('t-shop');
  t.innerHTML = '<div class="card"><input id="s-q" placeholder="ابحث عن منتج…" value="' + esc(QTXT) + '"></div><div id="s-list" class="mut" style="text-align:center">جارٍ تحميل المنتجات…</div>';
  $('s-q').oninput = e => { QTXT = e.target.value; drawShop(); };
  await loadCat(force); drawShop();
}
function drawShop() {
  const l = $('s-list'); if (!l) return;
  const q = norm(QTXT), list = CAT.filter(p => !q || norm(p.name).includes(q));
  if (!list.length) { l.className = ''; l.innerHTML = '<div class="card mut">لا توجد منتجات' + (QTXT ? ' مطابقة' : ' منشورة بعد') + '.</div>'; return; }
  l.className = 'pgrid'; l.style.textAlign = '';
  l.innerHTML = list.map(p => {
    const q = CART[p.id] ? CART[p.id].q : 0;
    return `<div class="pc"><div class="im">${p.img ? `<img loading="lazy" src="${p.img}" alt="">` : '🛒'}</div>
      <div class="b"><div class="n">${esc(p.name)}</div>${p.details ? `<div class="mut">${esc(p.details).slice(0, 70)}</div>` : ''}<div class="p">${money(p.price)} ج</div>
      <div class="qty">${q ? `<button data-a="m" data-i="${p.id}">−</button><b>${q}</b><button data-a="p" data-i="${p.id}">+</button>` : `<button class="gb full" data-a="p" data-i="${p.id}">أضف للسلة</button>`}</div></div></div>`;
  }).join('');
  l.onclick = e => { const b = e.target.closest('button[data-a]'); if (!b) return; bump(b.dataset.i, b.dataset.a === 'p' ? 1 : -1); drawShop(); };
}
function bump(id, dq) {
  const p = CAT.find(x => x.id === id); if (!p) return;
  const q = Math.max(0, Math.min(999, ((CART[id] && CART[id].q) || 0) + dq));
  if (q) CART[id] = { n:p.name, p:+p.price, q }; else delete CART[id];
  saveCart(); updateCart();
}
function cartTotal() { return Object.values(CART).reduce((s, i) => s + i.p * i.q, 0); }
function updateCart() {
  const n = Object.keys(CART).length, bar = $('cartbar');
  bar.classList.toggle('hide', !n || !$('t-shop') || $('t-shop').classList.contains('hide'));
  $('cb-n').textContent = n; $('cb-t').textContent = money(cartTotal());
}
$('cb-open').onclick = () => openCart();
function openCart() {
  const ids = Object.keys(CART);
  const s = $('sheet'), c = $('sheet-in'); s.classList.remove('hide');
  c.innerHTML = `<h2 style="margin:0 0 8px;color:var(--navy2)">طلبك</h2>` +
    (ids.length ? ids.map(id => { const i = CART[id]; return `<div class="row"><div style="flex:1"><b>${esc(i.n)}</b><div class="mut">${money(i.p)} ج</div></div>
        <div class="qty" style="min-width:110px"><button data-a="m" data-i="${esc(id)}">−</button><b>${i.q}</b><button data-a="p" data-i="${esc(id)}">+</button></div><b style="min-width:70px;text-align:left">${money(i.p * i.q)}</b></div>`; }).join('') : '<p class="mut">السلة فارغة</p>') +
    `<div class="row"><b>الإجمالي</b><b style="font-size:20px">${money(cartTotal())} ج</b></div>
     <label>ملاحظة للطلب (اختياري)</label><textarea id="o-note" rows="2" placeholder="مثال: التسليم بعد العصر"></textarea>
     <div style="display:flex;gap:8px;margin-top:12px"><button class="gb" style="flex:1" id="o-send" ${ids.length ? '' : 'disabled'}>إرسال الطلب</button><button class="ghost" id="o-close">إغلاق</button></div>
     <p class="mut">يصل طلبك للإدارة فوراً، وسيُضاف على حسابك بعد التجهيز.</p>`;
  c.onclick = e => { const b = e.target.closest('button[data-a]'); if (!b) return; const id = b.dataset.i; const q = (CART[id] ? CART[id].q : 0) + (b.dataset.a === 'p' ? 1 : -1); if (q <= 0) delete CART[id]; else CART[id].q = q; saveCart(); updateCart(); drawShop(); openCart(); };
  $('o-close').onclick = () => s.classList.add('hide');
  s.onclick = e => { if (e.target === s) s.classList.add('hide'); };
  $('o-send').onclick = sendOrder;
}
async function sendOrder() {
  const ids = Object.keys(CART); if (!ids.length) return;
  const items = ids.map(id => ({ n:CART[id].n, q:CART[id].q, p:CART[id].p }));
  const total = Math.round(cartTotal() * 100) / 100, note = ($('o-note').value || '').trim().slice(0, 300);
  const b = $('o-send'); b.disabled = true; b.textContent = 'جارٍ الإرسال…';
  try {
    await fsM.addDoc(fsM.collection(fs, 'orders'), { uid:ME.uid, phone:ME.ph, name:ME.name || ME.ph, items, total, note, status:'new', createdAt:fsM.serverTimestamp() });
    if (FB.ntfy) { try { fetch('https://ntfy.sh/' + FB.ntfy, { method:'POST', headers:{ Title:'New order', Priority:'high' }, body:(ME.name || ME.ph) + ' - ' + items.length + ' items - ' + total + ' EGP' }); } catch (e) {} }
    CART = {}; saveCart(); updateCart(); $('sheet').classList.add('hide'); drawShop();
    toast('تم إرسال طلبك ✓'); show('t-ord');
  } catch (e) { b.disabled = false; b.textContent = 'إرسال الطلب'; toast('تعذر الإرسال: ' + errText(e)); }
}

/* ---------- طلباتي ---------- */
const STL = { new:'جديد', prep:'قيد التجهيز', done:'تم التسليم', cancel:'ملغي' };
function renderOrd() {
  const t = $('t-ord');
  t.innerHTML = ORD.length ? ORD.map(o => `<div class="card"><div class="row" style="border:0;padding:0 0 6px"><b>${esc(new Date(ms(o)).toLocaleString('ar-EG'))}</b><span class="st ${esc(o.status)}">${STL[o.status] || esc(o.status)}</span></div>
      ${(o.items || []).map(i => `<div class="row"><span>${esc(i.n)} × ${i.q}</span><b>${money(i.p * i.q)}</b></div>`).join('')}
      <div class="row" style="border:0"><b>الإجمالي</b><b>${money(o.total)} ج</b></div>${o.note ? `<div class="mut">ملاحظتك: ${esc(o.note)}</div>` : ''}</div>`).join('')
    : '<div class="card mut">لا توجد طلبات بعد. اطلب من المتجر 🛍️</div>';
}

/* ---------- المزيد ---------- */
function renderMore() {
  $('t-more').innerHTML = `<div class="card"><h2>تغيير كلمة المرور</h2><label>كلمة المرور الجديدة (6 أحرف أو أكثر)</label><input id="m-pw" type="password" autocomplete="new-password"><button class="full" id="m-save" style="margin-top:10px">حفظ</button><div id="m-msg" class="mut" style="margin-top:8px"></div></div>
    <button class="red full" id="m-out">تسجيل الخروج</button>`;
  $('m-out').onclick = () => authM.signOut(auth);
  $('m-save').onclick = async () => {
    const v = $('m-pw').value; if (v.length < 6) { $('m-msg').textContent = 'كلمة المرور قصيرة'; return; }
    try { await authM.updatePassword(auth.currentUser, v); $('m-msg').textContent = 'تم تغيير كلمة المرور ✓'; $('m-pw').value = ''; }
    catch (e) { $('m-msg').textContent = e.code === 'auth/requires-recent-login' ? 'سجّل الخروج ثم ادخل من جديد ثم أعد المحاولة' : errText(e); }
  };
}

/* ---------- التنقل ---------- */
function show(id) {
  ['t-acc', 't-shop', 't-ord', 't-more'].forEach(x => $(x).classList.toggle('hide', x !== id));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === id));
  if (id === 't-shop') renderShop(false);
  updateCart(); window.scrollTo(0, 0);
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => show(b.dataset.t));
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
